appId: cm.cplan.app
name: Navigation principale de l'espace parent
---
- launchApp:
    clearState: true
- tapOn: 'Se connecter'
- tapOn:
    id: 'login-phone'
- inputText: ${PARENT_PHONE}
- tapOn:
    id: 'login-password'
- inputText: ${PARENT_PASSWORD}
- hideKeyboard
- tapOn: 'Se connecter'
- tapOn: 'Continuer vers mon espace'
- assertVisible: 'Solde familial à régler'
- tapOn: 'Paiements'
- assertVisible: 'Historique clair de tous vos règlements.'
- tapOn: 'Profil'
- assertVisible: 'Mon profil'
