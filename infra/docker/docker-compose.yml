name: cplan

# Les ports hôte sont volontairement décalés (54xx / 63xx / 90xx / 80xx) pour
# cohabiter avec d'autres projets déjà lancés sur cette machine (5432, 6379,
# 1025 sont couramment occupés). Les ports INTERNES aux conteneurs restent
# standards. Si vous changez un port ici, mettez à jour apps/api/.env.example.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cplan
      POSTGRES_PASSWORD: cplan_dev_password
      POSTGRES_DB: cplan
      # Nécessaire pour que les tris et comparaisons de chaînes soient
      # déterministes entre les postes (Windows / Linux / macOS).
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=fr-FR --encoding=UTF8'
    ports:
      - '5442:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cplan -d cplan']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cplan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6389:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO ne distribue plus ses versions récentes sous forme d'images
    # publiques. L'image locale est compilée depuis le tag source officiel.
    build:
      context: ./minio
      dockerfile: Dockerfile.server
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    image: cplan/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: cplan-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cplan
      MINIO_ROOT_PASSWORD: cplan_dev_password
    ports:
      - '9010:9000' # API S3
      - '9011:9001' # Console web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:9000/minio/health/live >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 10

  # Crée le bucket au démarrage puis s'arrête. Idempotent.
  minio-init:
    build:
      context: ./minio
      dockerfile: Dockerfile.client
      args:
        MC_VERSION: RELEASE.2025-08-13T08-35-41Z
    image: cplan/minio-mc:RELEASE.2025-08-13T08-35-41Z
    container_name: cplan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cplan cplan_dev_password &&
      mc mb --ignore-existing local/cplan-dev &&
      mc anonymous set none local/cplan-dev &&
      echo 'Bucket cplan-dev prêt (accès privé).'
      "

  # Serveur SMTP de test : capture tous les e-mails, UI sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: cplan-mailpit
    restart: unless-stopped
    ports:
      - '1035:1025' # SMTP
      - '8035:8025' # UI web
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  redis_data:
  minio_data:
